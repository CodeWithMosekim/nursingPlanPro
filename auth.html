<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sign in ✨ NursePlan Pro</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
  <a href="index.html" class="back-link">← back to home</a>

<div class="auth-card">
  <h2 id="title">welcome back 👋</h2>
  <p id="sub" class="muted">sign in to keep going</p>

  <div class="role-toggle">
    <button class="role-btn active" data-role="student">🎓 student</button>
    <button class="role-btn" data-role="lecturer">👩‍🏫 lecturer</button>
  </div>

  <form id="auth-form">
    <div class="field" id="name-field" style="display:none">
      <label>name</label>
      <input type="text" id="name" placeholder="your name">
    </div>
    <div class="field">
      <label>email</label>
      <input type="email" id="email" placeholder="you@school.edu" required>
    </div>
    <div class="field">
      <label>password</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">sign in</button>
  </form>

  <p class="switch"><span id="switch-text">no account?</span> <a href="#" id="switch-link">sign up</a></p>
</div>

<script src="js/auth.js"></script>
</body>
</html>
